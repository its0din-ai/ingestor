<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ingestor — secure file ingestion for airgapped environments">
  <title>ingestor — secure file ingestion for airgapped environments</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08050F"/>
      <stop offset="0.55" stop-color="#120A22"/>
      <stop offset="1" stop-color="#1A0F2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2A1B45" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Product mark: application brand icon (templates/admin.html .brand-icon) -->
  <rect x="72" y="112" width="96" height="96" rx="24" fill="#150B26" stroke="url(#accent)" stroke-width="2"/>
  <g transform="translate(81 121) scale(3.25)" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 4 6v6c0 5 3.6 8.2 8 9 4.4-.8 8-4 8-9V6l-8-3Z"/>
    <path d="M12 16V9M9 12l3-3 3 3"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="200" y="180" font-size="58" font-weight="700" letter-spacing="1" fill="#F5F3FF">ingestor</text>
    <text x="201" y="216" font-size="20" letter-spacing="0.2" fill="#B4A7CC">Secure file ingestion for airgapped environments</text>

    <!-- Capability chips -->
    <g font-size="11" font-weight="600" letter-spacing="1.2" fill="#D8B4FE" text-anchor="middle">
      <rect x="200" y="240" width="150" height="28" rx="14" fill="#170D29" stroke="#3B2A5E"/>
      <text x="275" y="258">SINGLE BINARY</text>
      <rect x="362" y="240" width="164" height="28" rx="14" fill="#170D29" stroke="#3B2A5E"/>
      <text x="444" y="258">SQLITE STORAGE</text>
      <rect x="538" y="240" width="180" height="28" rx="14" fill="#170D29" stroke="#3B2A5E"/>
      <text x="628" y="258">BEARER-TOKEN API</text>
    </g>
  </g>

  <!-- Security motif -->
  <g fill="none">
    <circle cx="1070" cy="160" r="100" stroke="#2A1B45" stroke-width="1.2"/>
    <circle cx="1070" cy="160" r="135" stroke="#2A1B45" stroke-width="1.2" stroke-dasharray="3 8"/>
    <circle cx="1070" cy="160" r="170" stroke="#2A1B45" stroke-width="1.2" stroke-dasharray="2 12"/>
    <circle cx="1070" cy="160" r="110" fill="#A855F7" opacity="0.1" filter="url(#blur)"/>
    <path d="M1070 96L1122 117V166C1122 202 1097 224 1070 236C1043 224 1018 202 1018 166V117Z" fill="#170D2A" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M1045 162l17 17 34-38" stroke="#E9D5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
