name: container

on:
  push:
    # Only build/publish for completed version tags (e.g. v3.13.0).
    # Branch pushes and pull requests do not publish anything.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify this is the newest version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a completed version tag (expected vX.Y.Z)."
            exit 1
          fi
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [[ "$tag" != "$latest" ]]; then
            echo "::error::'$tag' is not the newest tag ('$latest'); refusing to build an older version."
            exit 1
          fi
          echo "Building newest version tag: $tag"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR packages default to private even when the repository is public.
      # Make the package public so `docker pull` works without credentials.
      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          payload='{"visibility":"public"}'
          echo "$payload" | gh api --method PATCH "/user/packages/container/${name}" --input - 2>/dev/null || \
          echo "$payload" | gh api --method PATCH "/orgs/${owner}/packages/container/${name}" --input - 2>/dev/null || \
          echo "::warning::Could not set package visibility; set it to public under GitHub → Packages."
