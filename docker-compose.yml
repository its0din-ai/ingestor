services:
  ingestor:
    # Pin a version for reproducible deploys, e.g.
    #   INGESTOR_IMAGE=ghcr.io/its0din-ai/ingestor:3.12.0 docker compose up -d
    image: ${INGESTOR_IMAGE:-ghcr.io/its0din-ai/ingestor:latest}
    restart: unless-stopped
    ports:
      - "${INGESTOR_PORT:-8080}:8080"
    environment:
      # Container-specific overrides; everything else comes from .env.
      host: 0.0.0.0
      port: "8080"
      db_path: /data/ingestor.db
      upload_dir: uploads
    env_file:
      - .env
    volumes:
      # Option 1 (default): Docker-managed named volumes.
      # Option 2: set these to host paths for bind mounts, e.g.
      #   INGESTOR_DATA_DIR=./data INGESTOR_UPLOADS_DIR=./uploads
      - ${INGESTOR_DATA_DIR:-ingestor-data}:/data
      - ${INGESTOR_UPLOADS_DIR:-ingestor-uploads}:/app/uploads

volumes:
  ingestor-data:
  ingestor-uploads:
